name: Primer Pipeline CI

on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint
  
  secret-scanner:
    name: Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      
      - name: Análisis de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest
    needs: [lint,secret-scanner]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "=========================================="
          echo "            PRIMER PIPELINE CI            "
          echo "=========================================="
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Version de docker
        run: docker --version
        
      - name: Finalizar pipeline
        run: echo "Pipeline ejecutando correctamente."

      - name: Mostrar mensaje de éxito
        run: echo "Pipeline completado con éxito."
